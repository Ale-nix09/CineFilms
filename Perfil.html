<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Perfil</title>
</head>
<body class="bg-gray-800 flex items-center justify-center h-screen">
  
     <!-- Boton de regresar -->
    <div class="absolute top-4 left-4">
        <a href="index.html" class="text-gray-700 hover:text-gray-500 bg-slate-300 px-4 py-2 rounded-md font-semibold transition duration-200 shadow-md">Regresar</a>
    </div>
    

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-sm">
        <!-- Título -->
        <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>

        <!-- Formulario -->
        <form>
            <!--Usuario -->
            <div class="mb-4">
                <label for="username" class="block text-gray-700 font-bold mb-2">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!--Contraseña -->
            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-bold mb-2">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Botón de Enviar -->
            <div class="flex justify-center">
                <button type="submit" class="bg-blue-600 text-white w-full px-4 py-2 rounded-md hover:bg-blue-500 transition duration-200 font-semibold shadow-lg">
                    Ingresar
                </button>
            </div>
        </form>

        <!-- Enlace de Recuperación de Contraseña -->
        <div class="mt-6 text-center">
            <a href="#" class="text-blue-600 hover:text-blue-400 text-sm font-semibold">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

</body>
</html>
